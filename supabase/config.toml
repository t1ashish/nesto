[functions.gather-places]
enabled = true
verify_jwt = false
# These endpoints are server-to-server (Owner Console backend, pg_cron) and
# authenticate with the x-engine-secret header instead of a user JWT.

[functions.gather-registry]
enabled = true
verify_jwt = false
# See above.

[functions.gather-osm]
enabled = true
verify_jwt = false
# No API keys needed (Nominatim + Overpass are free); x-engine-secret still required.
